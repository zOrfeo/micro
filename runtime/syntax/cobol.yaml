filetype: cobol

detect:
    filename: "\\.(cob|cbl|cobol)$"

rules:
    # Default
    - identifier: '\\b[A-Z][A-Z0-9-]*\\b'

    # Identification Division
    - type: '^.{7}[ ]{0,3}(IDENTIFICATION|ID)[ ]+DIVISION($|[^A-Za-z0-9-])'
    - type: '^.{7}[ ]{0,3}(PROGRAM-ID|CLASS-ID|FACTORY|OBJECT|METHOD-ID)($|[^A-Za-z0-9-])'
    - type: "(^|[^A-Za-z0-9-])((?:IS[ ]+)?(?:RECURSIVE|COMMON(?:[ ]+INITIAL)?|INITIAL(?:[ ]+COMMON)?)(?:[ ]+PROGRAM)?)([^A-Za-z0-9-]|$)"
    - type: '^.{7}[ ]{0,3}(AUTHOR|INSTALLATION|DATE-WRITTEN|DATE-COMPILED|SECURITY)($|[^A-Za-z0-9-])'
    
    # Environment Division
    - type: '^.{7}[ ]{0,3}ENVIRONMENT[ ]+DIVISION($|[^A-Za-z0-9-])'
    - type: '^.{7}[ ]{0,3}CONFIGURATION[ ]+SECTION($|[^A-Za-z0-9-])'
    - type: '^.{7}[ ]{0,3}(SOURCE-COMPUTER|OBJECT-COMPUTER|SPECIAL-NAMES)($|[^A-Za-z0-9-])'
    
    - type: '([^A-Za-z0-9-](IS)[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](ON)([ ]+STATUS)?([ ]+IS)?[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](OFF)([ ]+STATUS)?([ ]+IS)?[^A-Za-z0-9-])'
    
    - type: '([^A-Za-z0-9-](ALPHABET)[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](IS)?([ ]+(STANDARD-1|STANDARD-2|NATIVE|EBCDIC))?([ ]+SYMBOLIC)?([ ]+CHARACTERS)?[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](THRU|THROUGH|ALSO)[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](ARE|IN|IS)[^A-Za-z0-9-])'

    - type: '([^A-Za-z0-9-](CLASS|IS|THROUGH|THRU)[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](CURRENCY)([ ]+SIGN)?([ ]+IS)?[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](WITH)?([ ]+PICTURE[ ]+SYMBOL)?[^A-Za-z0-9-])'

    - type: '([^A-Za-z0-9-](DECIMAL-POINT)([ ]+IS)?([ ]+COMMA)($|[^A-Za-z0-9-]))'
    - type: '([^A-Za-z0-9-](XML-SCHEMA)[^A-Za-z0-9-])'

    - type: '^.{7}[ ]{0,3}(REPOSITORY)([^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](CLASS)|((FUNCTION[ ]+ALL[ ]+INTRINSIC)))($|[^A-Za-z0-9-])'
    - type: '([^A-Za-z0-9-](FUNCTION|INTRINSIC)($|[^A-Za-z0-9-]))'
    
    # Data Division
    - type: '^.{7}[ ]{0,3}DATA[ ]+DIVISION($|[^A-Za-z0-9-])'

    # Procedure Division
    - type: '^.{7}[ ]{0,3}PROCEDURE[ ]+DIVISION[ ]*[.]+[ ]*$'
    - type: '([^A-Za-z0-9-])SECTION($|[^A-Za-z0-9-])'

    # Full Stops / Periods
    - operator: '[.]{1}'

    # Exec
    - preproc:
        start: "([^A-Za-z0-9-])EXEC"
        end: "END-EXEC"
    
    # Strings (double quotes)
    - constant.string: '".*"'

    # Strings (single quotes)
    - constant.string: "'.*'"
    
    # Comments
    - comment: '^.{6}\*.*$'

    # Sequence Number Area
    - comment.todo: '^.{6}'
